<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长通信息科技工作室 · 官网</title>
  <style>
    /* 全局重置 & 字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #1e293b;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* 主容器——卡片式布局 */
    .container {
      max-width: 860px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.02);
      padding: 2.5rem 2.2rem;
      transition: all 0.2s ease;
      border: 1px solid #eef2f6;
    }

    /* 标题区域 */
    h1 {
      font-size: 2.4rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #0f172a;
      margin-bottom: 0.5rem;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    h1::after {
      content: "🛠️";
      font-size: 2rem;
      font-weight: 400;
      margin-left: 0.25rem;
    }

    /* 通用标题样式 */
    h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #0f172a;
      margin: 2rem 0 1rem 0;
      letter-spacing: -0.01em;
      border-left: 5px solid #3b82f6;
      padding-left: 1rem;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1e293b;
      margin: 1.5rem 0 0.8rem 0;
    }

    /* 段落与引用风格 */
    p {
      margin-bottom: 1rem;
      color: #334155;
      font-size: 1.02rem;
    }

    /* 引文样式 (如尘土那句) */
    .quote {
      font-style: italic;
      color: #475569;
      background: #f1f5f9;
      padding: 0.9rem 1.4rem;
      border-radius: 20px;
      margin: 1.2rem 0;
      border-left: 5px solid #94a3b8;
      font-size: 1.05rem;
    }

    /* 成员/加入信息区块 */
    .join-info {
      background: #f8fafc;
      border-radius: 18px;
      padding: 1.5rem 1.8rem;
      margin: 1.5rem 0 1rem 0;
      border: 1px solid #e2e8f0;
    }

    .join-info p {
      margin-bottom: 0.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .join-info strong {
      font-weight: 600;
      color: #0f172a;
    }

    /* 邮箱链接样式 */
    .email-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed #93c5fd;
      transition: all 0.15s;
      padding: 0 0.1rem;
    }

    .email-link:hover {
      color: #1d4ed8;
      border-bottom-color: #1d4ed8;
      background: #eff6ff;
      border-radius: 4px;
    }

    /* 图片区域 */
    .image-section {
      margin: 1.8rem 0 1rem 0;
      display: flex;
      justify-content: center;
    }

    .image-section img {
      max-width: 100%;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #eef2f6;
      transition: transform 0.2s ease;
    }

    .image-section img:hover {
      transform: scale(1.01);
    }

    /* 工具区块 – 嵌入式flash */
    .tool-embed {
      background: #f1f5f9;
      border-radius: 24px;
      padding: 1.8rem 1.8rem 1rem 1.8rem;
      margin: 1rem 0 0.8rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tool-embed embed {
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      background: #ffffff;
      max-width: 100%;
    }

    /* 下载链接样式 */
    .download-link {
      display: inline-block;
      margin-top: 0.8rem;
      font-size: 0.95rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      padding: 0.45rem 1.2rem;
      border-radius: 100px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      transition: all 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .download-link:hover {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 8px 16px -6px #3b82f6;
    }

    /* 友情链接区域 */
    .friend-links {
      list-style: none;
      margin: 0.5rem 0 0.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .friend-links li {
      margin: 0;
    }

    .friend-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #1e293b;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      background: #f8fafc;
      border-radius: 100px;
      border: 1px solid #e2e8f0;
      transition: all 0.15s;
      width: fit-content;
      font-size: 1rem;
    }

    .friend-links a::before {
      content: "🔗";
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .friend-links a:hover {
      background: #ffffff;
      border-color: #3b82f6;
      color: #1d4ed8;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1);
      transform: translateX(4px);
    }

    /* 分隔线 */
    hr {
      border: none;
      border-top: 2px dashed #e2e8f0;
      margin: 2rem 0 1rem 0;
      width: 100%;
    }

    /* 适配移动端 */
    @media (max-width: 550px) {
      .container {
        padding: 1.8rem 1.2rem;
        border-radius: 22px;
      }

      h1 {
        font-size: 1.9rem;
      }

      h1::after {
        font-size: 1.6rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      .tool-embed {
        padding: 1rem;
      }

      embed {
        height: auto;
        width: 100%;
        max-width: 500px;
      }

      .friend-links a {
        width: 100%;
        box-sizing: border-box;
      }
    }

    /* 修复一些链接包裹问题 */
    a {
      text-decoration: none;
    }

    /* 针对老式 embed 的宽度控制 */
    .embed-responsive {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* 小改进：让“打不开？点击下载”更精致 */
    .download-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }

    /* 微调 dog.gif 图片尺寸（若原图过大） */
    .image-section img {
      max-height: 280px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 主标题 -->
    <h1>长通信息科技工作室</h1>

    <!-- 介绍部分 -->
    <h2>介绍</h2>
    <div class="quote">
      “什么是尘土？从大地之肺发出的一声叹息。”
    </div>

    <p>
      长通是非常棒的一个工作室，我们都在这里更新软件、精简系统、捣鼓游戏等。
      我们的工作室目前已有5名成员；如果你有意愿，向
      <strong>@长通</strong> 审核电脑技术能力后即可加入。
    </p>

    <div class="join-info">
      <p>
        <span>📮 邮箱：</span>
        <a href="mailto:changtongxinxikeji@163.com" class="email-link">changtongxinxikeji@163.com</a>
      </p>
    </div>

    <!-- 图片 dog.gif (保留原始风格) -->
    <div class="image-section">
      <img src="dog.gif" alt="Big Boat">
    </div>


    <!-- 友情链接 -->
    <h2>友情链接</h2>
    <ul class="friend-links">
      <li>
        <a href="https://www.mcmod.cn/" target="_blank" rel="noopener">MC百科 | 最大的Minecraft中文MOD百科</a>
      </li>
      <li>
        <a href="https://zh.minecraft.wiki/" target="_blank" rel="noopener">中文 Minecraft Wiki</a>
      </li>
      <li>
        <a href="https://www.mcbbs.net" target="_blank" rel="noopener">Minecraft(我的世界)中文论坛</a>
      </li>
    </ul>

    <!-- 底部留一点呼吸空间，加一个极简装饰 -->
    <hr>
    <p style="text-align: center; font-size: 0.85rem; color: #94a3b8; margin-top: 1rem;">
      长通信息科技 · 保持简洁，保持热爱
    </p>
  </div>

  <!-- 原有的 body 背景颜色已经由 CSS 覆盖为 #f8fafc，更柔和 -->
</body>
</html>
